databases:
  - name: employee-management-db
    plan: free

services:
  - type: web
    name: employee-management-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: employee-management-db
          property: connectionString
      - key: APP_URL
        sync: false
